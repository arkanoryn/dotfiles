#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

[default_session]
# Layout: editor | ai agent | shell (top-right) | lazygit (bottom-right).
# Columns auto-balance; refocus on the AI agent pane when done.
# NOTE: tmux.conf sets `pane-base-index 1`, so panes are numbered 1..4:
#   1 = editor (yh)   2 = ai agent (pim)   3 = shell (top-right)   4 = lazygit
# yh/pim are fish abbreviations (interactive-only). Each interactive pane
# installs a fish_prompt hook that signals a tmux wait-for channel; a
# background process wakes on those signals and types the abbr + space
# (triggers expansion) + Enter.
startup_command = '''
fish -c '
tmux split-window -h "fish --init-command=\"function __sesh_ready --on-event fish_prompt; tmux wait-for -S pane_agent_ready; functions -e __sesh_ready; end\""
tmux split-window -h "fish"
tmux split-window -v -t 3 "lazygit"
tmux run-shell -b "tmux wait-for pane_editor_ready; tmux send-keys -t 1 yh Space C-m; tmux wait-for pane_agent_ready; tmux send-keys -t 2 pim Space C-m"
tmux select-pane -t 2
exec fish --init-command="function __sesh_ready --on-event fish_prompt; tmux wait-for -S pane_editor_ready; functions -e __sesh_ready; end"
'
'''
preview_command = "eza --all --git --icons --color=always {}"

[[session]]
name = "dotfiles"
path = "~/.dotfiles"
preview_command = "eza --all --git --icons --color=always ~/.dotfiles"
windows = [ "code", "agent", "git" ]


[[wildcard]]
pattern = "~/Code/*"
preview_command = "eza --all --git --icons --color=always {}"
windows = [ "code", "agent", "git" ]

# Window templates with pane layouts
# First window of session gets 3 panes (1 left, 2 right) via default_session
# Additional windows use 2 panes (1 left, 1 right)

[[window]]
name = "code"
startup_script = "fish -c 'tmux split-window -h \"fish\"; tmux select-layout main-vertical; exec env NVIM_APPNAME=lazyvim nvim .'"

[[window]]
name = "agent"
startup_script = "fish -c 'tmux split-window -h \"fish\"; tmux select-layout main-vertical; exec vibe'"

[[window]]
name = "git"
startup_script = "fish -c 'tmux split-window -h \"fish\"; tmux select-layout main-vertical; exec lazygit'"
