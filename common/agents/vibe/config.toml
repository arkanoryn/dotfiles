active_model = "mistral-medium-3.5"
vim_keybindings = true
default_agent = "auto-approve"
disable_welcome_banner_animation = false
displayed_workdir = ""
auto_compact_threshold = 200000
context_warnings = false
textual_theme = "catppuccin-mocha"
instructions = ""
include_commit_signature = true
include_model_info = true
include_project_context = true
include_prompt_detail = true
enable_update_checks = true
api_timeout = 720.0
tool_paths = []
mcp_servers = []
enabled_tools = []
disabled_tools = []
enabled_skills = []
disabled_skills = []
connectors = [
    { name = "github_app", disabled = true },
    { name = "mermaid", disabled = true },
    { name = "outlook_calendar", disabled = true },
    { name = "slack", disabled = true },
]
theme = "catppuccin-mocha"

[[providers]]
name = "mistral"
api_base = "https://api.mistral.ai/v1"
api_key_env_var = "MISTRAL_API_KEY"
api_style = "openai"
backend = "mistral"

[[models]]
name = "mistral-vibe-cli-latest"
provider = "mistral"
alias = "mistral-medium-3.5"
temperature = 1.0
input_price = 1.5
output_price = 7.5
thinking = "max"

[[models]]
name = "devstral-small-latest"
provider = "mistral"
alias = "devstral-small"
temperature = 0.2
input_price = 0.1
output_price = 0.3

[project_context]
max_chars = 40000
default_commit_count = 5
max_doc_bytes = 32768
truncation_buffer = 1000
max_depth = 3
max_files = 1000
max_dirs_per_level = 20
timeout_seconds = 2.0

[session_logging]
save_dir = "~/.vibe/logs/session"
session_prefix = "session"
enabled = true

[tools.bash]
permission = "ask"
allowlist = [
    "/home/arkanoryn/Code/*",
    "cat",
    "cd",
    "curl",
    "echo",
    "file",
    "find",
    "git add",
    "git diff",
    "git log",
    "git ls-tree",
    "git show",
    "git status",
    "git worktree",
    "grep",
    "head",
    "identify",
    "ls",
    "mkdir",
    "npm install",
    "npm run build",
    "npx",
    "printf",
    "pwd",
    "qmk",
    "sed",
    "sesh",
    "sort",
    "stat",
    "tail",
    "tree",
    "uname",
    "wc",
    "which",
    "whoami",
    "xargs",
]
denylist = [
    "gdb",
    "pdb",
    "passwd",
    "nano",
    "vim",
    "vi",
    "emacs",
    "bash -i",
    "sh -i",
    "zsh -i",
    "fish -i",
    "dash -i",
    "screen",
    "tmux",
]
max_output_bytes = 16000
default_timeout = 30
denylist_standalone = [
    "python",
    "python3",
    "ipython",
    "bash",
    "sh",
    "nohup",
    "vi",
    "vim",
    "emacs",
    "nano",
    "su",
]

[tools.grep]
permission = "always"
allowlist = [
    "/home/arkanoryn/Code/*",
]
denylist = []
max_output_bytes = 64000
default_max_matches = 100
default_timeout = 60
exclude_patterns = [
    ".venv/",
    "venv/",
    ".env/",
    "env/",
    "node_modules/",
    ".git/",
    "__pycache__/",
    ".pytest_cache/",
    ".mypy_cache/",
    ".tox/",
    ".nox/",
    ".coverage/",
    "htmlcov/",
    "dist/",
    "build/",
    ".idea/",
    ".vscode/",
    "*.egg-info",
    "*.pyc",
    "*.pyo",
    "*.pyd",
    ".DS_Store",
    "Thumbs.db",
]
codeignore_file = ".vibeignore"

[tools.read_file]
permission = "always"
allowlist = [
    "/home/arkanoryn/Code/*",
]
denylist = []
max_read_bytes = 64000
max_state_history = 10

[tools.search_replace]
permission = "always"
allowlist = []
denylist = []
max_content_size = 100000
create_backup = false
fuzzy_threshold = 0.9

[tools.todo]
permission = "always"
allowlist = []
denylist = []
max_todos = 100

[tools.write_file]
permission = "always"
allowlist = [
    "/home/arkanoryn/Code/*",
]
denylist = []
max_write_bytes = 64000
create_parent_dirs = true

[tools.task]
permission = "always"
